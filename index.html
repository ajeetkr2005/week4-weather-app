<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast Pro | Ajeet Kumar</title>

```
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
```

</head>
<body>

<div class="background"></div>

<div class="container">

```
<div class="glass-card">

    <h1>🌦 Weather Forecast </h1>
    <p class="subtitle">
        Real-Time Weather Updates Around The World
    </p>

    <div class="search-box">
        <input
            type="text"
            id="cityInput"
            placeholder="Enter city name..."
        >
        <button id="searchBtn">🔍 Search</button>
    </div>

    <div id="loader" class="loader hidden"></div>

    <div id="weatherContainer">

        <div class="main-weather">

            <h2 id="cityName">Search a City</h2>

          
            <div class="temp-section">

                <img
                    id="weatherIcon"
                    src=""
                    alt="Weather Icon"
                >

                <h1 id="temperature">--°C</h1>

            </div>

            <p id="description">
                Weather Description
            </p>

        </div>

        <div class="weather-details">

            <div class="detail-card">
                <h3>💧 Humidity</h3>
                <p id="humidity">--%</p>
            </div>

            <div class="detail-card">
                <h3>💨 Wind</h3>
                <p id="wind">-- km/h</p>
            </div>

            <div class="detail-card">
                <h3>📊 Pressure</h3>
                <p id="pressure">-- hPa</p>
            </div>

            <div class="detail-card">
                <h3>🌡 Feels Like</h3>
                <p id="feelsLike">--°C</p>
            </div>

        </div>

    </div>

    <div class="developer">
        © 2026 Developed by ❤️ Ajeet Kumar
    </div>

</div>
```

</div>

<script src="js/config.js"></script>

<script src="js/storage.js"></script>

<script src="js/weatherService.js"></script>

<script src="js/ui.js"></script>

<script src="js/app.js"></script>

</body>
</html>
